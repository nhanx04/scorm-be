    source_hint: "Slide chương 2 môn Microeconomics"

# ---------------------------------------------------------------------
# Các tính năng AI được test
# ---------------------------------------------------------------------
features:
  - id: "outline"
    endpoint: "/api/v1/ai/generate-outline-from-file"
    request_params:
      targetAudience: "Sinh viên đại học năm 2-3"
      audienceProficiencyLevel: "Trung cấp"
      duration: "8 tuần"
      additionalInstructions: ""
    dto_class: "com.scorm.generator.dto.ai.AiCourseOutline"

  - id: "page-content"
    endpoint: "/api/v1/ai/generate-page-content"
    request_params:
      pageTitle: "Sẽ lấy động từ outline đã sinh ở feature outline"
      additionalContext: ""
    dto_class: "com.scorm.generator.dto.ai.AiPageContentResponse"
    few_shot_enabled: true

  - id: "quiz"
    endpoint: "/api/v1/ai/generate-quiz"
    request_params:
      numberOfQuestions: 5
      questionTypes: ["SINGLE_CHOICE", "TRUE_FALSE"]
      difficulty: "MEDIUM"
    dto_class: "com.scorm.generator.dto.ai.AiQuizResponse"
    few_shot_enabled: true

# ---------------------------------------------------------------------
# Tham số đo và mục tiêu (target) — tham chiếu mục 5.4
# ---------------------------------------------------------------------
metrics:
  reliability:
    json_parse_success_rate_target: 0.95
    schema_validation_pass_target: 0.95
    empty_field_rate_target: 0.02

  latency:
    p95_target_seconds: 30.0
    max_acceptable_seconds: 60.0

  cost:
    # Đơn giá USD/1M token (Gemini 2.5 Pro công bố tháng 5/2026)
    input_price_per_million: 3.50
    output_price_per_million: 10.50
    # Bump lên $15 vì tổng 915 trang tài liệu (D05 lên tới 360 trang)
    # khiến token outline lớn hơn dự kiến ban đầu
    total_budget_usd: 15.00

  faithfulness:
    auto_score_target: 4.0   # trên thang 1-5
    hallucination_rate_target: 0.10   # < 10%

  pedagogical:
    all_criteria_pass_target: 0.70   # ≥ 70% câu hỏi đạt cả 4 tiêu chí

  iwf:
    flaw_free_rate_target: 0.50      # ≥ 50% câu hỏi không mắc flaw nào
    severely_flawed_rate_target: 0.20  # ≤ 20% câu hỏi mắc ≥ 2 flaw
    kappa_target: 0.60               # κ inter-rater ≥ 0.6

# ---------------------------------------------------------------------
# Output paths
# ---------------------------------------------------------------------
output:
  base_dir: "src/test/resources/ai-eval/results"
  reliability_csv: "reliability_{timestamp}.csv"
  latency_cost_csv: "latency_cost_{timestamp}.csv"
  faithfulness_auto_csv: "faithfulness_auto_{timestamp}.csv"
  human_scoring_template: "human_scoring_template.csv"
  iwf_scoring_template: "iwf_scoring_template.csv"

# ---------------------------------------------------------------------
# Sample size cho human evaluation (Nhóm C & D & IWF)
# ---------------------------------------------------------------------
human_eval:
  faithfulness_sample_size: 30      # random 30 từ 60 outputs
  reviewers: 2
  quiz_sample_size: 50              # 10 docs × 5 câu hỏi/quiz
  rubric_pedagogical: "rubrics/pedagogical-rubric.md"
  rubric_iwf: "rubrics/iwf-checklist.md"
