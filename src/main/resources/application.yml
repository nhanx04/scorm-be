spring:
  application:
    name: scorm-package-generator-api

  # --- CẤU HÌNH AWS GIẢ (BẮT BUỘC ĐỂ CHẠY OFFLINE) ---
  # Các dòng này cung cấp thông tin "rác" để thư viện AWS không báo lỗi khi khởi động
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: dummy-access-key
        secret-key: dummy-secret-key
  # ---------------------------------------------------

  datasource:
    url: jdbc:postgresql://localhost:5432/scorm
    driver-class-name: org.postgresql.Driver
    username: postgres # <-- THAY ĐỔI USERNAME CỦA BẠN NẾU KHÁC
    password: "pass123" # <-- THAY ĐỔI PASSWORD CỦA BẠN NẾU KHÁC

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # 'update' giữ dữ liệu, 'create' xóa sạch làm lại từ đầu
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

jwt:
  secret: your-secret-key-change-this-in-production-environment-with-a-long-random-string
  expiration: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.scorm: DEBUG

# Cấu hình riêng của App (Vẫn giữ để code Java đọc được biến này, tránh lỗi Null)
aws:
  region: ap-southeast-2
  s3:
    bucket-name: scorm-generator-hcmut
    prefix: scorm/
