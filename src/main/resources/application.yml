spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- PHẦN MỚI THÊM ĐỂ FIX LỖI REGION ---
  cloud:
    aws:
      region:
        static: ${AWS_REGION:auto} # Lấy từ .env, nếu không có thì mặc định là 'auto'
      stack:
        auto: false # Tắt tính năng CloudFormation (không cần thiết với R2) để boot nhanh hơn
  # ---------------------------------------

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 0

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  r2:
    endpoint: ${APP_R2_ENDPOINT}
    public-base-url: ${APP_R2_PUBLIC_BASE_URL}
    bucket: ${APP_R2_BUCKET:scorm-generator}
    access-key-id: ${APP_R2_ACCESS_KEY_ID}
    secret-access-key: ${APP_R2_SECRET_ACCESS_KEY}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api}
