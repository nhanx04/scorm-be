# --- CẤU HÌNH AI (GEMINI) - QUAN TRỌNG ---
# Key API (Đọc từ biến môi trường)
spring.ai.gemini.api-key=${GOOGLE_GENAI_API_KEY}
# Project ID (Bắt buộc)
spring.ai.gemini.project-id=${GOOGLE_GENAI_PROJECT_ID}
# Model
spring.ai.gemini.chat.options.model=gemini-1.5-flash

# --- Cấu hình dự phòng (Nếu thư viện dùng prefix cũ/mới) ---
spring.ai.google.genai.project-id=${GOOGLE_GENAI_PROJECT_ID}
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}

# --- CẤU HÌNH DATABASE ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CẤU HÌNH AWS / STORAGE ---
spring.cloud.aws.region.static=${AWS_REGION:auto}
spring.cloud.aws.stack.auto=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=0

# --- CẤU HÌNH APP (JWT, R2) ---
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.r2.endpoint=${APP_R2_ENDPOINT}
app.r2.public-base-url=${APP_R2_PUBLIC_BASE_URL}
app.r2.bucket=${APP_R2_BUCKET:scorm-generator}
app.r2.access-key-id=${APP_R2_ACCESS_KEY_ID}
app.r2.secret-access-key=${APP_R2_SECRET_ACCESS_KEY}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}