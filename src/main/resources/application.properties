# --- CẤU HÌNH AI (GOOGLE GENAI) - ĐÃ SỬA ---
# Quan trọng: Phải dùng prefix "spring.ai.google.genai" cho thư viện bạn đang dùng
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.project-id=${GOOGLE_GENAI_PROJECT_ID}

# Cấu hình Model chính xác (Bắt buộc để không bị fallback về gemini-2.0-flash)
spring.ai.google.genai.chat.model=gemini-2.5-pro
spring.ai.google.genai.chat.options.model=gemini-2.5-pro

# Tùy chỉnh tham số sinh (Optional)
spring.ai.google.genai.chat.options.temperature=0.7

# Few-shot prompt feature flags (có thể tắt nhanh nếu phát hiện regression)
app.ai.quiz.few-shot-enabled=${AI_QUIZ_FEW_SHOT_ENABLED:true}
app.ai.page-content.few-shot-enabled=${AI_PAGE_FEW_SHOT_ENABLED:true}

# Quiz cần grounding mạnh hơn outline → temperature thấp hơn default (0.7)
app.ai.quiz.temperature=${AI_QUIZ_TEMPERATURE:0.3}

# --- CẤU HÌNH DATABASE ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CẤU HÌNH HIKARI CP (Giảm tối đa connection để tránh lỗi MaxClientsInSessionMode) ---
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_MAX_LIFETIME:1200000}

# --- CẤU HÌNH FLYWAY ---
# Mặc định bật Flyway để đảm bảo schema luôn có đủ bảng mới (có thể override nếu cần)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.validate-on-migrate=${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:false}
spring.flyway.connect-retries=${SPRING_FLYWAY_CONNECT_RETRIES:10}
spring.flyway.connect-retries-interval=${SPRING_FLYWAY_CONNECT_RETRIES_INTERVAL:5}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# --- CẤU HÌNH AWS / STORAGE ---
spring.cloud.aws.region.static=${AWS_REGION:auto}
spring.cloud.aws.stack.auto=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=0

# --- CẤU HÌNH APP (JWT, R2) ---
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

app.r2.endpoint=${APP_R2_ENDPOINT}
app.r2.public-base-url=${APP_R2_PUBLIC_BASE_URL}
app.r2.bucket=${APP_R2_BUCKET:scorm-generator}
app.r2.access-key-id=${APP_R2_ACCESS_KEY_ID}
app.r2.secret-access-key=${APP_R2_SECRET_ACCESS_KEY}

server.address=0.0.0.0
server.port=${PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}